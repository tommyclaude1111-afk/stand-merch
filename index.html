<meta charset="utf-8">
<title>Stand Merch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper: #F7F4EE;
    --panel: #FFFFFF;
    --panel-2: #EFEBE2;
    --line: rgba(28,24,18,0.12);
    --ink: #1C1913;
    --ink-dim: #6B6355;
    --accent: #E85A2A;
    --accent-ink: #FFF7F1;
    --accent-2: #1C8F8A;
    --accent-2-ink: #F0FFFE;
    --ok: #2E8B4F;
    --ok-bg: rgba(46,139,79,0.12);
    --warn: #9A6A00;
    --warn-bg: rgba(197,140,10,0.16);
    --danger: #C0293F;
    --danger-bg: rgba(192,41,63,0.12);
    --shadow: 0 1px 2px rgba(28,24,18,0.06), 0 8px 24px -12px rgba(28,24,18,0.18);
    --radius: 14px;
    --font-display: "Bebas Neue", "Arial Narrow", sans-serif;
    --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #17171A;
      --panel: #1F2023;
      --panel-2: #26272B;
      --line: rgba(255,255,255,0.10);
      --ink: #F1EFE9;
      --ink-dim: #9B968A;
      --accent: #FF7A45;
      --accent-ink: #241206;
      --accent-2: #3FC7C0;
      --accent-2-ink: #052220;
      --ok: #6FCF7B;
      --ok-bg: rgba(111,207,123,0.16);
      --warn: #F5B841;
      --warn-bg: rgba(245,184,65,0.16);
      --danger: #FF6B7F;
      --danger-bg: rgba(255,107,127,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper: #17171A;
    --panel: #1F2023;
    --panel-2: #26272B;
    --line: rgba(255,255,255,0.10);
    --ink: #F1EFE9;
    --ink-dim: #9B968A;
    --accent: #FF7A45;
    --accent-ink: #241206;
    --accent-2: #3FC7C0;
    --accent-2-ink: #052220;
    --ok: #6FCF7B;
    --ok-bg: rgba(111,207,123,0.16);
    --warn: #F5B841;
    --warn-bg: rgba(245,184,65,0.16);
    --danger: #FF6B7F;
    --danger-bg: rgba(255,107,127,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:400; letter-spacing:0.02em; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .app{ max-width:920px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  /* header */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 18px 0;
  }
  .head-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-size:28px; letter-spacing:0.03em; }
  .brand .tag{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-dim); font-family:var(--font-body); font-weight:700; }
  .clock{ font-family:var(--font-mono); font-size:13px; color:var(--ink-dim); font-variant-numeric:tabular-nums; text-align:right; }
  .clock .status{ display:block; margin-top:2px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:600; }
  .pill.live{ background:var(--ok-bg); color:var(--ok); }
  .pill.live::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--ok); }
  .pill.sync{ background:var(--panel-2); color:var(--ink-dim); margin-left:6px; }
  .pill.sync.ok{ background:color-mix(in srgb, var(--accent-2) 16%, transparent); color:var(--accent-2); }
  .pill.sync.warn{ background:var(--warn-bg); color:var(--warn); }

  nav.tabs{ display:flex; gap:4px; margin-top:14px; }
  nav.tabs button{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding:10px 6px 12px; font-family:var(--font-display); font-size:18px; letter-spacing:0.04em;
    color:var(--ink-dim); border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
  }
  nav.tabs button.active{ color:var(--ink); border-color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  main{ flex:1; padding:18px; padding-bottom:100px; }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .18s ease; }
  @media (prefers-reduced-motion: reduce){ .panel.active{ animation:none; } }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-dim);
  }
  .empty h3{ color:var(--ink); font-size:22px; margin-bottom:8px; }
  .empty p{ max-width:38ch; margin:0 auto 18px; line-height:1.5; }

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:10px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font-weight:700; font-size:14px; padding:11px 16px; cursor:pointer;
    transition:transform .08s ease, background .15s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:var(--danger); }
  .btn.block{ width:100%; }
  .btn.sm{ padding:7px 12px; font-size:13px; }

  /* VENTE tab */
  .ref-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .ref-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  .ref-card h3{ font-size:22px; margin-bottom:2px; }
  .ref-prices{ display:flex; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
  .price-tag{ font-family:var(--font-mono); font-size:12.5px; padding:3px 8px; border-radius:7px; font-weight:600; }
  .price-tag.plein{ background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
  .price-tag.staff{ background:color-mix(in srgb, var(--accent-2) 18%, transparent); color:var(--accent-2); }
  .size-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .size-chip{
    min-width:56px; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); cursor:pointer; text-align:center; font-weight:700;
    display:flex; flex-direction:column; gap:2px; transition:background .12s, transform .08s;
  }
  .size-chip .sz{ font-size:14px; }
  .size-chip .qty{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); font-weight:600; }
  .size-chip:active{ transform:scale(0.95); }
  .size-chip.low .qty{ color:var(--warn); }
  .size-chip.out{ opacity:0.45; cursor:not-allowed; background:transparent; }
  .size-chip.out .qty{ color:var(--danger); }
  .size-chip:not(.out):hover{ background:var(--line); }

  /* STOCK tab */
  .stock-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .stock-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); font-weight:700; }
  .field input, .field select{
    font-family:var(--font-mono); font-size:15px; padding:9px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); width:100%;
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field.text input{ font-family:var(--font-body); font-weight:700; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sizes-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:10px; margin-top:6px; }
  .stock-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; }

  .lock-screen{ max-width:340px; margin:40px auto; text-align:center; }
  .lock-screen .icon{ width:44px; height:44px; margin:0 auto 14px; color:var(--ink-dim); }
  .lock-screen h3{ font-size:24px; margin-bottom:6px; }
  .lock-screen p{ color:var(--ink-dim); font-size:13.5px; line-height:1.5; margin:0 0 20px; }
  .lock-screen form{ display:flex; flex-direction:column; gap:12px; text-align:left; }
  .lock-screen .error{ color:var(--danger); font-size:13px; font-weight:600; min-height:18px; text-align:left; }
  .stock-topbar{ display:flex; justify-content:flex-end; margin-bottom:10px; }

  .new-ref-card{ border:1px dashed var(--line); border-radius:var(--radius); padding:16px; }
  .new-ref-card > summary{ list-style:none; cursor:pointer; font-family:var(--font-display); font-size:19px; letter-spacing:0.03em; display:flex; align-items:center; gap:8px; }
  .new-ref-card > summary::before{ content:"+"; font-family:var(--font-body); font-weight:800; }
  .new-ref-card[open] > summary::before{ content:"–"; }
  .new-ref-card form{ margin-top:14px; display:flex; flex-direction:column; gap:12px; }

  details.settings{ margin-top:20px; }
  details.settings summary{ cursor:pointer; color:var(--ink-dim); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; }
  .settings-body{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  textarea.backup{ width:100%; min-height:90px; font-family:var(--font-mono); font-size:11px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); padding:8px; }

  /* RAPPORT tab */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-tile{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
  .stat-tile .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); font-weight:700; }
  .stat-tile .value{ font-family:var(--font-mono); font-size:26px; font-weight:600; margin-top:4px; }
  .stat-tile .sub{ font-size:12px; color:var(--ink-dim); margin-top:3px; }
  .stat-tile.accent .value{ color:var(--accent); }
  .stat-tile.accent2 .value{ color:var(--accent-2); }

  h2.section-title{ font-size:20px; margin:22px 0 10px; letter-spacing:0.03em; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); box-shadow:var(--shadow); }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:480px; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-dim); font-weight:700; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:var(--font-mono); }
  .stock-badge{ display:inline-flex; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:700; font-family:var(--font-mono); }
  .stock-badge.ok{ background:var(--ok-bg); color:var(--ok); }
  .stock-badge.low{ background:var(--warn-bg); color:var(--warn); }
  .stock-badge.out{ background:var(--danger-bg); color:var(--danger); }

  .log-list{ display:flex; flex-direction:column; gap:0; max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); box-shadow:var(--shadow); }
  .log-row{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:13px; }
  .log-row:last-child{ border-bottom:none; }
  .log-row time{ font-family:var(--font-mono); color:var(--ink-dim); width:52px; flex-shrink:0; }
  .log-row .ref{ font-weight:700; flex:1; }
  .log-row .tag{ font-family:var(--font-mono); font-size:11px; padding:2px 7px; border-radius:6px; }
  .log-row .tag.plein{ background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
  .log-row .tag.staff{ background:color-mix(in srgb, var(--accent-2) 18%, transparent); color:var(--accent-2); }
  .log-row .price{ font-family:var(--font-mono); font-weight:600; width:64px; text-align:right; }

  .history-item{ border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden; }
  .history-item > summary{ list-style:none; cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; font-weight:700; }
  .history-item > summary::-webkit-details-marker{ display:none; }
  .history-item .hist-body{ padding:0 16px 14px; border-top:1px solid var(--line); }

  .actions-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

  /* toast */
  #toast-wrap{ position:fixed; left:0; right:0; bottom:18px; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast{
    pointer-events:auto; background:var(--ink); color:var(--paper); padding:11px 14px; border-radius:12px;
    display:flex; align-items:center; gap:12px; font-size:13.5px; font-weight:600; box-shadow:0 10px 30px -8px rgba(0,0,0,0.4);
    animation:toastin .18s ease;
  }
  :root:not([data-theme="light"]) .toast, :root[data-theme="dark"] .toast{ background:var(--panel-2); color:var(--ink); border:1px solid var(--line); }
  @keyframes toastin{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .toast button{ background:none; border:none; color:var(--accent); font-weight:800; cursor:pointer; font-size:13px; }

  /* sheet (tarif picker) + generic confirm modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,8,4,0.45); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  .modal-backdrop.open{ display:flex; }
  .sheet{
    background:var(--panel); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,0.3);
    animation:sheetup .2s ease;
  }
  @media (min-width:600px){ .sheet{ border-radius:20px; margin-bottom:40px; } .modal-backdrop{ align-items:center; } }
  @keyframes sheetup{ from{ transform:translateY(30px); opacity:0.6; } to{ transform:none; opacity:1; } }
  .sheet-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  .sheet-head h3{ font-size:24px; }
  .sheet-head .close{ background:none; border:none; color:var(--ink-dim); font-size:22px; cursor:pointer; line-height:1; padding:4px; }
  .tarif-btn{
    width:100%; display:flex; justify-content:space-between; align-items:center; padding:16px 18px;
    border-radius:12px; border:none; cursor:pointer; margin-bottom:10px; font-family:var(--font-body); font-weight:800; font-size:16px;
  }
  .tarif-btn.plein{ background:var(--accent); color:var(--accent-ink); }
  .tarif-btn.staff{ background:var(--accent-2); color:var(--accent-2-ink); }
  .tarif-btn .price{ font-family:var(--font-mono); font-size:18px; }
  .confirm-message{ color:var(--ink-dim); font-size:14px; line-height:1.55; margin:0 0 22px; }
  .confirm-actions{ display:flex; gap:10px; }

  @media print{
    header, nav.tabs, .actions-row, #toast-wrap, #sheet-backdrop, .panel:not(#panel-rapport){ display:none !important; }
    #panel-rapport{ display:block !important; }
    body{ background:#fff; color:#000; }
    .stat-tile, .table-wrap, .log-list, .history-item{ box-shadow:none; border-color:#ccc; }
  }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  .site-gate{ position:fixed; inset:0; z-index:100; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:24px; }
  [hidden]{ display:none !important; }
  .site-gate-card{ max-width:340px; width:100%; text-align:center; }
  .site-gate-card .brand-mark{ font-family:var(--font-display); font-size:32px; letter-spacing:0.03em; margin-bottom:4px; }
  .site-gate-card .tag{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-dim); font-weight:700; display:block; margin-bottom:28px; }
  .site-gate-card form{ display:flex; flex-direction:column; gap:12px; text-align:left; }
  .site-gate-card .error{ color:var(--danger); font-size:13px; font-weight:600; min-height:18px; text-align:left; }
</style>

<div class="site-gate" id="site-gate">
  <div class="site-gate-card">
    <span class="brand-mark">STAND MERCH</span>
    <span class="tag">T-shirts &middot; usage interne</span>
    <form id="site-gate-form">
      <div class="field text"><label>Identifiant</label><input type="text" id="gate-user" autocomplete="username" required></div>
      <div class="field text"><label>Mot de passe</label><input type="password" id="gate-pass" autocomplete="current-password" required></div>
      <div class="error" id="gate-error"></div>
      <button type="submit" class="btn primary block">Se connecter</button>
    </form>
  </div>
</div>

<div class="app" id="app-root" hidden>
  <header>
    <div class="head-row">
      <div class="brand">
        <h1>Stand Merch</h1>
        <span class="tag">T-shirts &middot; usage interne</span>
      </div>
      <div class="clock">
        <span id="clock-time" class="num">--:--:--</span>
        <span class="status"><span class="pill live" id="session-pill">Soirée en cours</span><span class="pill sync" id="sync-pill">connexion…</span></span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="active" data-tab="vente" role="tab" aria-selected="true">Vente</button>
      <button data-tab="stock" role="tab" aria-selected="false">Stock</button>
      <button data-tab="rapport" role="tab" aria-selected="false">Rapport</button>
    </nav>
  </header>

  <main>
    <!-- VENTE -->
    <section class="panel active" id="panel-vente"></section>

    <!-- STOCK -->
    <section class="panel" id="panel-stock"></section>

    <!-- RAPPORT -->
    <section class="panel" id="panel-rapport"></section>
  </main>
</div>

<div id="sheet-backdrop" class="modal-backdrop">
  <div class="sheet" role="dialog" aria-modal="true" id="sheet">
    <div class="sheet-head">
      <h3 id="sheet-title">—</h3>
      <button class="close" id="sheet-close" aria-label="Fermer">&times;</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="confirm-backdrop" class="modal-backdrop">
  <div class="sheet" role="alertdialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="confirm-title">Confirmation</h3>
    </div>
    <p class="confirm-message" id="confirm-message"></p>
    <div class="confirm-actions">
      <button class="btn ghost block" id="confirm-cancel">Annuler</button>
      <button class="btn primary block" id="confirm-ok">Confirmer</button>
    </div>
  </div>
</div>

<div id="toast-wrap" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script>
(function(){
  "use strict";
  var STORE_KEY = "standmerch_v1";
  var ADMIN_SESSION_KEY = "standmerch_admin";
  var ADMIN_USER = "mainroom";
  var ADMIN_PASS = "salutessaim";
  // Real Firebase account behind the admin gate: only this login can write to
  // Firestore (see security rules). The anonymous session used for everyone
  // else can only read. Must match a user created in Firebase Auth > Users.
  var ADMIN_FIREBASE_EMAIL = "admin@stand-merch.internal";
  var ADMIN_FIREBASE_PASSWORD = "StandMerch-Adm1n-2026!";
  var GATE_SESSION_KEY = "standmerch_gate";
  var GATE_USER = "staff";
  var GATE_PASS = "merch2026";
  var SIZES_ALL = ["XS","S","M","L","XL","XXL"];

  function isAdmin(){
    try{ return sessionStorage.getItem(ADMIN_SESSION_KEY) === "1"; }catch(e){ return false; }
  }
  function setAdmin(v){
    try{
      if(v) sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
      else sessionStorage.removeItem(ADMIN_SESSION_KEY);
    }catch(e){}
  }
  function isGateOpen(){
    try{ return localStorage.getItem(GATE_SESSION_KEY) === "1"; }catch(e){ return false; }
  }
  function setGateOpen(v){
    try{

  function loadLocalCache(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);

    return { references: [], sales: [], history: [], sessionStart: Date.now() };

  // ---------- Firestore sync ----------
  // Shared data (references, sales, history) lives in one Firestore document
  // so every device that opens the app sees the same live state. localStorage
  // is kept only as an offline-tolerant cache: it renders instantly on load
  // and survives a dropped connection, but Firestore is the source of truth.
  var firebaseConfig = {
    apiKey: "AIzaSyDFPn4OsldnAVbKe9jsoB4ZPT32UfLsouU",
    authDomain: "stand-merch.firebaseapp.com",
    projectId: "stand-merch",
    storageBucket: "stand-merch.firebasestorage.app",
    messagingSenderId: "47626009443",
    appId: "1:47626009443:web:da010294475800d8343156"
  };
  var stateDocRef = null;
  var syncPillEl = null;
  var listenerAttached = false;

  function initFirestore(){
    try{
      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
      stateDocRef = db.collection("standmerch").doc("state");
      firebase.auth().signInAnonymously().catch(function(err){
        console.error("Firebase auth failed", err);
        setSyncStatus("hors-ligne", "warn");
      });
      firebase.auth().onAuthStateChanged(function(user){
        if(user && !listenerAttached){ listenerAttached = true; attachStateListener(); }
      });
    }catch(e){
      console.error("Firestore init failed", e);
      setSyncStatus("hors-ligne", "warn");
    }
  }

  var listenerRetryTimer = null;
  function attachStateListener(){
    if(listenerRetryTimer){ clearTimeout(listenerRetryTimer); listenerRetryTimer = null; }
    stateDocRef.onSnapshot(function(doc){
      if(doc.exists){
        state = doc.data();
        if(!state.references) state.references = [];
        if(!state.sales) state.sales = [];
        if(!state.history) state.history = [];
        if(!state.sessionStart) state.sessionStart = Date.now();
        cacheLocally(state);
        if(doc.metadata.fromCache){ setSyncStatus("hors-ligne (cache)", "warn"); }
        else{ setSyncStatus("synchronisé", "ok"); }
        refreshVisibleTab();
      } else {
        var seed = loadLocalCache();
        stateDocRef.set(seed).catch(function(err){ console.error("seed failed", err); });
      }
    }, function(err){
      console.error("Firestore listen failed", err);
      setSyncStatus("hors-ligne", "warn");
      listenerRetryTimer = setTimeout(attachStateListener, 3000);
    });
  }

  function setSyncStatus(label, cls){
    if(!syncPillEl) syncPillEl = document.getElementById("sync-pill");
    if(!syncPillEl) return;
    syncPillEl.textContent = label;
    syncPillEl.className = "pill sync" + (cls ? " " + cls : "");
  }

  function refreshVisibleTab(){
    var activeBtn = document.querySelector("nav.tabs button.active");
    var tab = activeBtn ? activeBtn.dataset.tab : "vente";
    if(tab === "vente") renderVente();
    if(tab === "stock") renderStock();
    if(tab === "rapport") renderRapport();
  }

  var state = loadLocalCache();
  if(!state.sessionStart) state.sessionStart = Date.now();

  function saveState(){
    cacheLocally(state);
    if(stateDocRef){
      stateDocRef.set(state).catch(function(err){ console.error("save failed", err); });
    }
  }

  if(typeof firebase !== "undefined"){
    initFirestore();
  } else {

  }

  // ---------- helpers ----------
  function stockStatus(qty){
    if(qty <= 0) return "out";
    if(qty <= 3) return "low";
    return "ok";
  }
  function refById(id){ return state.references.find(function(r){ return r.id === id; }); }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function copyToClipboard(text, successMsg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(successMsg); }).catch(function(){ fallbackCopy(text, successMsg); });
    } else {
      fallbackCopy(text, successMsg);
    }
  }
  function fallbackCopy(text, successMsg){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(successMsg); }
    catch(e){ toast("Copie échouée — copiez manuellement"); }
    document.body.removeChild(ta);
  }
  function csvCell(v){
    var s = String(v);
    if(/[";\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function csvNum(n){ return (Math.round(n*100)/100).toFixed(2).replace(".", ","); }

  // ---------- toast ----------
  function toast(msg, undoFn){
    var wrap = document.getElementById("toast-wrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = "<span>" + escapeHtml(msg) + "</span>";
    if(undoFn){
      var btn = document.createElement("button");
      btn.textContent = "Annuler";
      btn.onclick = function(){ undoFn(); el.remove(); };
      el.appendChild(btn);
    }
    wrap.appendChild(el);
    setTimeout(function(){ el.remove(); }, 5000);
  }

  // ---------- confirm modal (replaces window.confirm, which iOS silently
  // suppresses inside home-screen "Add to Home Screen" standalone apps) ----------
  var confirmBackdrop = document.getElementById("confirm-backdrop");
  var confirmMessageEl = document.getElementById("confirm-message");
  var confirmOkBtn = document.getElementById("confirm-ok");
  var confirmCancelBtn = document.getElementById("confirm-cancel");
  var confirmOnOk = null;
  function showConfirm(message, onConfirm, opts){
    opts = opts || {};
    confirmMessageEl.textContent = message;
    confirmOkBtn.textContent = opts.confirmLabel || "Confirmer";
    confirmOkBtn.className = "btn block " + (opts.danger ? "danger" : "primary");
    confirmOnOk = onConfirm;
    confirmBackdrop.classList.add("open");
  }
  function closeConfirm(){ confirmBackdrop.classList.remove("open"); confirmOnOk = null; }
  confirmOkBtn.addEventListener("click", function(){ var fn = confirmOnOk; closeConfirm(); if(fn) fn(); });
  confirmCancelBtn.addEventListener("click", closeConfirm);

  // ================= VENTE =================
  function renderVente(){
    var el = document.getElementById("panel-vente");
    if(state.references.length === 0){
      el.innerHTML = '<div class="empty"><h3>Aucune référence</h3><p>Ajoutez vos modèles de t-shirts et leurs stocks dans l’onglet Stock avant de commencer les ventes.</p><button class="btn primary" id="go-stock">Aller à Stock</button></div>';
      document.getElementById("go-stock").onclick = function(){ document.querySelector('nav.tabs button[data-tab="stock"]').click(); };
      return;
    }
    var html = '<div class="ref-grid">';
    state.references.forEach(function(ref){
      html += '<div class="ref-card">';
      html += '<h3>' + escapeHtml(ref.nom) + '</h3>';
      html += '<div class="ref-prices">';
      html += '<span class="price-tag plein">Plein ' + euro(ref.prixPlein) + '</span>';
      html += '<span class="price-tag staff">Staff ' + euro(ref.prixStaff) + '</span>';
      html += '</div>';
      html += '<div class="size-row">';

        var qty = ref.tailles[sz].stock;

        html += '<button class="size-chip ' + (st==="out"?"out":st==="low"?"low":"") + '" ' + (st==="out"?"disabled":"") +
          ' data-ref="' + ref.id + '" data-size="' + sz + '">' +
          '<span class="sz">' + sz + '</span><span class="qty">' + (st==="out"?"rupture":qty) + '</span></button>';
      });
      html += '</div></div>';
    });

      chip.addEventListener("click", function(){

  function openTarifSheet(refId, size){
    var ref = refById(refId);
    if(!ref) return;
    var body =
      '<button class="tarif-btn plein" data-tarif="plein"><span>Plein tarif</span><span class="price num">' + euro(ref.prixPlein) + '</span></button>' +
      '<button class="tarif-btn staff" data-tarif="staff"><span>Tarif staff</span><span class="price num">' + euro(ref.prixStaff) + '</span></button>';
    openSheet(escapeHtml(ref.nom) + " — " + size, body);
    sheetBody.querySelectorAll(".tarif-btn").forEach(function(b){
      b.addEventListener("click", function(){
        recordSale(ref.id, size, b.dataset.tarif);
        closeSheet();
      });
    });
  }

  function recordSale(refId, size, tarif){
    var ref = refById(refId);
    if(!ref || !ref.tailles[size] || ref.tailles[size].stock <= 0) return;
    ref.tailles[size].stock -= 1;
    var prix = tarif === "staff" ? ref.prixStaff : ref.prixPlein;
    var sale = { id: uid(), ts: Date.now(), refId: ref.id, refNom: ref.nom, taille: size, tarif: tarif, prix: prix };
    state.sales.push(sale);
    saveState();
    renderVente();
    toast((tarif === "staff" ? "Tarif staff" : "Plein tarif") + " · " + ref.nom + " " + size + " · " + euro(prix), function(){
      undoSale(sale.id);
    });
  }

  function undoSale(saleId){
    var idx = state.sales.findIndex(function(s){ return s.id === saleId; });
    if(idx === -1) return;
    var sale = state.sales[idx];
    var ref = refById(sale.refId);
    if(ref && ref.tailles[sale.taille]) ref.tailles[sale.taille].stock += 1;
    state.sales.splice(idx, 1);
    saveState();
    renderVente(); renderRapport();
    toast("Vente annulée");
  }

  // ================= STOCK =================
  function renderStock(){
    var el = document.getElementById("panel-stock");
    if(!isAdmin()){
      el.innerHTML = lockScreenHtml();
      wireLockScreen(el);
      return;
    }
    var html = '<div class="stock-topbar"><button class="btn ghost sm" id="btn-logout">Verrouiller</button></div>';
    if(state.references.length === 0){
      html += '<div class="empty" style="padding:24px 0 30px;"><h3>Créez votre première référence</h3><p>Nom, prix et stock par taille.</p></div>';
    } else {
      state.references.forEach(function(ref){
        html += stockCardHtml(ref);
      });
    }
    html += newRefFormHtml();
    html += settingsHtml();
    el.innerHTML = html;
    document.getElementById("btn-logout").addEventListener("click", function(){
      setAdmin(false);
      renderStock();
      toast("Accès admin verrouillé");
      if(typeof firebase !== "undefined"){
        firebase.auth().signOut().then(function(){
          return firebase.auth().signInAnonymously();
        }).catch(function(err){ console.error("Return to anonymous session failed", err); });
      }
    });
    wireStockEvents(el);
  }

  function lockScreenHtml(){
    return '<div class="lock-screen">' +
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>' +
      '<h3>Accès administrateur</h3>' +
      '<p>La gestion des références, tarifs et stocks est réservée à l’administration du stand.</p>' +
      '<form id="lock-form">' +
      '<div class="field text"><label>Identifiant</label><input type="text" id="lock-user" autocomplete="username" required></div>' +

      '<div class="error" id="lock-error"></div>' +

      '</form></div>';

  function wireLockScreen(el){
    var form = el.querySelector("#lock-form");
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var u = el.querySelector("#lock-user").value.trim();
      var p = el.querySelector("#lock-pass").value;
      if(u === ADMIN_USER && p === ADMIN_PASS){
        setAdmin(true);
        renderStock();
        if(typeof firebase !== "undefined"){
          firebase.auth().signInWithEmailAndPassword(ADMIN_FIREBASE_EMAIL, ADMIN_FIREBASE_PASSWORD)
            .catch(function(err){
              console.error("Admin Firebase sign-in failed", err);
              toast("Connecté localement, mais l'écriture en base pourrait être refusée (config Firebase à vérifier)");
            });
        }
      } else {
        el.querySelector("#lock-error").textContent = "Identifiant ou mot de passe incorrect.";
        el.querySelector("#lock-pass").value = "";
        el.querySelector("#lock-pass").focus();
      }
    });

    var h = '<div class="stock-card" data-ref="' + ref.id + '">';
    h += '<div class="stock-head"><div class="field text" style="flex:1;"><label>Référence</label><input type="text" class="in-nom" value="' + escapeHtml(ref.nom) + '"></div>' +
         '<button class="btn danger sm btn-del" title="Supprimer">Supprimer</button></div>';
    h += '<div class="row2">' +
         '<div class="field"><label>Prix plein tarif (€)</label><input type="number" step="0.5" min="0" class="in-plein" value="' + ref.prixPlein + '"></div>' +

    }

      '<summary>Réglages &amp; sauvegarde</summary>' +

      '<div class="field"><label>Restaurer depuis une sauvegarde</label>' +

  function wireStockEvents(el){
    el.querySelectorAll(".stock-card").forEach(function(card){
      var refId = card.dataset.ref;
      card.querySelector(".btn-save").addEventListener("click", function(){
        var ref = refById(refId);
        ref.nom = card.querySelector(".in-nom").value.trim() || ref.nom;
        ref.prixPlein = parseFloat(card.querySelector(".in-plein").value) || 0;
        ref.prixStaff = parseFloat(card.querySelector(".in-staff").value) || 0;
        card.querySelectorAll(".in-qty").forEach(function(inp){
          var sz = inp.dataset.size;
          ref.tailles[sz].stock = Math.max(0, parseInt(inp.value,10) || 0);
        });
        var addSel = card.querySelector(".in-addsize");
        if(addSel && addSel.value){ ref.tailles[addSel.value] = { stock: 0 }; }
        saveState();
        toast("Référence enregistrée");
        renderStock(); renderVente();
      });
      card.querySelector(".btn-del").addEventListener("click", function(){
        showConfirm('Supprimer "' + refById(refId).nom + '" ? Cette action est définitive.', function(){
          state.references = state.references.filter(function(r){ return r.id !== refId; });
          saveState();
          renderStock(); renderVente();
          toast("Référence supprimée");
        }, { confirmLabel: "Supprimer", danger: true });
      });
    });

    var form = document.getElementById("new-ref-form");
    if(form){
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var fd = new FormData(form);
        var tailles = {};
        SIZES_ALL.forEach(function(sz){
          var q = parseInt(fd.get("qty_" + sz), 10) || 0;
          if(q > 0) tailles[sz] = { stock: q };
        });
        if(Object.keys(tailles).length === 0){
          toast("Indiquez un stock initial pour au moins une taille");
          return;
        }
        state.references.push({
          id: uid(),
          nom: fd.get("nom").trim(),
          prixPlein: parseFloat(fd.get("prixPlein")) || 0,
          prixStaff: parseFloat(fd.get("prixStaff")) || 0,
          tailles: tailles,
          createdAt: Date.now()
        });
        saveState();
        renderStock(); renderVente();
        toast("Référence ajoutée");
      });
    }

    var backupOut = document.getElementById("backup-out");
    if(backupOut) backupOut.value = JSON.stringify(state);
    var copyBtn = document.getElementById("btn-copy-backup");
    if(copyBtn) copyBtn.addEventListener("click", function(){
      copyToClipboard(backupOut.value, "Copié dans le presse-papiers");
    });
    var restoreBtn = document.getElementById("btn-restore");
    if(restoreBtn) restoreBtn.addEventListener("click", function(){
      var raw = document.getElementById("backup-in").value.trim();
      if(!raw) return;
      var parsed;
      try{
        parsed = JSON.parse(raw);
        if(!parsed.references) throw new Error("format invalide");
      }catch(err){
        toast("JSON invalide — restauration annulée");
        return;
      }
      showConfirm("Remplacer toutes les données actuelles par cette sauvegarde ?", function(){
        state = parsed;
        if(!state.sales) state.sales = [];
        if(!state.history) state.history = [];
        if(!state.sessionStart) state.sessionStart = Date.now();
        saveState();
        renderStock(); renderVente(); renderRapport();
        toast("Données restaurées");
      }, { confirmLabel: "Restaurer", danger: true });
    });
    var resetBtn = document.getElementById("btn-reset-all");
    if(resetBtn) resetBtn.addEventListener("click", function(){
      showConfirm("Réinitialiser TOUTES les données (références, stocks, ventes, historique) ? Cette action est irréversible.", function(){
        state = { references: [], sales: [], history: [], sessionStart: Date.now() };
        saveState();
        renderStock(); renderVente(); renderRapport();
        toast("Données réinitialisées");
      }, { confirmLabel: "Réinitialiser", danger: true });
    });
  }

  // ================= RAPPORT =================
  function renderRapport(){
    var el = document.getElementById("panel-rapport");
    var sales = state.sales;
    var totalRevenue = sales.reduce(function(s,x){ return s + x.prix; }, 0);
    var plein = sales.filter(function(s){ return s.tarif === "plein"; });
    var staff = sales.filter(function(s){ return s.tarif === "staff"; });
    var pleinRev = plein.reduce(function(s,x){ return s+x.prix; },0);
    var staffRev = staff.reduce(function(s,x){ return s+x.prix; },0);

    var startedAt = new Date(state.sessionStart);
    var startedLabel = String(startedAt.getHours()).padStart(2,"0") + ":" + String(startedAt.getMinutes()).padStart(2,"0");

    var html = "";
    html += '<h2 class="section-title">Soirée en cours · début ' + startedLabel + '</h2>';
    html += '<div class="stat-grid">';
    html += statTile("Chiffre d’affaires", euro(totalRevenue), sales.length + " vente" + (sales.length!==1?"s":""), "accent");
    html += statTile("Plein tarif", euro(pleinRev), plein.length + " t-shirt" + (plein.length!==1?"s":""), "");
    html += statTile("Tarif staff", euro(staffRev), staff.length + " t-shirt" + (staff.length!==1?"s":""), "accent2");
    html += '</div>';

    if(state.references.length){
      html += '<h2 class="section-title">Détail par référence &amp; taille</h2>';
      html += '<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Taille</th><th class="num">Vendus ce soir</th><th class="num">CA</th><th class="num">Stock restant</th></tr></thead><tbody>';
      state.references.forEach(function(ref){
        Object.keys(ref.tailles).forEach(function(sz){
          var soldHere = sales.filter(function(s){ return s.refId===ref.id && s.taille===sz; });
          var qty = soldHere.length;
          var rev = soldHere.reduce(function(a,x){return a+x.prix;},0);
          var stock = ref.tailles[sz].stock;
          var st = stockStatus(stock);
          html += '<tr><td>' + escapeHtml(ref.nom) + '</td><td>' + sz + '</td><td class="num">' + qty + '</td><td class="num">' + euro(rev) + '</td>' +
            '<td class="num"><span class="stock-badge ' + st + '">' + (st==="out"?"rupture":stock) + '</span></td></tr>';
        });
      });
      html += '</tbody></table></div>';
    }

    html += '<h2 class="section-title">Journal des ventes</h2>';
    if(sales.length === 0){
      html += '<p style="color:var(--ink-dim);">Aucune vente enregistrée pour le moment.</p>';
    } else {
      html += '<div class="log-list">';
      sales.slice().reverse().forEach(function(s){
        var t = new Date(s.ts);
        html += '<div class="log-row"><time>' + String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0") + '</time>' +
          '<span class="ref">' + escapeHtml(s.refNom) + ' · ' + s.taille + '</span>' +
          '<span class="tag ' + s.tarif + '">' + (s.tarif==="staff"?"Staff":"Plein") + '</span>' +
          '<span class="price num">' + euro(s.prix) + '</span></div>';
      });
      html += '</div>';
    }

    html += '<div class="actions-row">';
    html += '<button class="btn ghost" id="btn-print">Imprimer / PDF</button>';
    html += '<button class="btn ghost" id="btn-export-csv">Copier pour Google Sheets</button>';
    html += '<button class="btn primary" id="btn-close-session" ' + (sales.length===0?"disabled":"") + '>Clôturer la soirée</button>';
    html += '</div>';

    if(state.history.length){
      html += '<h2 class="section-title">Historique des soirées</h2>';
      var admin = isAdmin();
      state.history.slice().reverse().forEach(function(h){
        var d = new Date(h.closedAt);
        html += '<details class="history-item" data-history-id="' + h.id + '"><summary><span>' + d.toLocaleDateString("fr-FR") + ' · clôturée ' + String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") + '</span><span class="num">' + euro(h.totalRevenue) + '</span></summary>';
        html += '<div class="hist-body"><p style="color:var(--ink-dim); font-size:13px; margin-bottom:' + (admin?"12px":"0") + ';">' + h.sales.length + ' t-shirts vendus · Plein ' + euro(h.pleinRev) + ' (' + h.pleinCount + ') · Staff ' + euro(h.staffRev) + ' (' + h.staffCount + ')</p>';
        if(admin){
          html += '<button class="btn ghost sm btn-history-download">Télécharger le rapport (CSV)</button>';
        } else {
          html += '<p style="color:var(--ink-dim); font-size:12px;">Connectez-vous en admin (onglet Stock) pour télécharger ce rapport.</p>';
        }
        html += '</div></details>';
      });
    }

    el.innerHTML = html;

    el.querySelectorAll(".btn-history-download").forEach(function(btn){
      btn.addEventListener("click", function(){
        var hid = btn.closest(".history-item").dataset.historyId;
        var h = state.history.find(function(x){ return x.id === hid; });
        if(!h) return;
        var hClosedAt = new Date(h.closedAt);
        var hStartedAt = h.openedAt ? new Date(h.openedAt) : hClosedAt;
        var hPlein = h.sales.filter(function(s){ return s.tarif === "plein"; });
        var hStaff = h.sales.filter(function(s){ return s.tarif === "staff"; });
        var hCsv = buildReportCSV(h.sales, h.totalRevenue, hPlein, hStaff, h.pleinRev, h.staffRev, hStartedAt, h.stockSnapshot, hClosedAt);
        var hFilename = "stand-merch-rapport-" + hClosedAt.toISOString().slice(0,10) + "-" +
          String(hClosedAt.getHours()).padStart(2,"0") + "h" + String(hClosedAt.getMinutes()).padStart(2,"0") + ".csv";
        saveReportFile(hFilename, hCsv).then(function(result){
          if(result.ok){
            toast("Rapport archivé enregistré");
          } else {
            copyToClipboard(hCsv, "Enregistrement indisponible ici, rapport copié à la place");
          }
        });
      });
    });

    document.getElementById("btn-print").addEventListener("click", function(){ window.print(); });
    document.getElementById("btn-export-csv").addEventListener("click", function(){
      var csv = buildReportCSV(sales, totalRevenue, plein, staff, pleinRev, staffRev, startedAt, state.references);
      copyToClipboard(csv, "Rapport copié — collez-le dans un Google Sheet (Édition > Collage spécial > Valeurs uniquement conseillé)");
    });
    var closeBtn = document.getElementById("btn-close-session");
    if(closeBtn) closeBtn.addEventListener("click", function(){
      showConfirm(
        "Clôturer la soirée ? Le rapport sera enregistré sur cet appareil, le journal archivé, et vous reviendrez à l'écran de connexion.",
        function(){
          var closedAt = new Date();
          var csv = buildReportCSV(sales, totalRevenue, plein, staff, pleinRev, staffRev, startedAt, state.references, closedAt);
          var filename = "stand-merch-rapport-" + closedAt.toISOString().slice(0,10) + "-" +
            String(closedAt.getHours()).padStart(2,"0") + "h" + String(closedAt.getMinutes()).padStart(2,"0") + ".csv";
          finalizeClosure({
            csv: csv, filename: filename, closedAt: closedAt, openedAt: startedAt.getTime(),
            totalRevenue: totalRevenue, pleinRev: pleinRev, pleinCount: plein.length,
            staffRev: staffRev, staffCount: staff.length,
            stockSnapshot: JSON.parse(JSON.stringify(state.references))
          });
        },
        { confirmLabel: "Clôturer" }
      );
    });
  }

  function finalizeClosure(d){
    saveReportFile(d.filename, d.csv).then(function(result){
      state.history.push({
        id: uid(),
        closedAt: d.closedAt.getTime(),
        openedAt: d.openedAt,
        sales: state.sales,
        totalRevenue: d.totalRevenue,
        pleinRev: d.pleinRev, pleinCount: d.pleinCount,
        staffRev: d.staffRev, staffCount: d.staffCount,
        stockSnapshot: d.stockSnapshot
      });
      state.sales = [];
      state.sessionStart = Date.now();
      saveState();
      if(result.ok){
        toast("Soirée clôturée — rapport enregistré");
      } else {
        copyToClipboard(d.csv, "Soirée clôturée — enregistrement indisponible ici, rapport copié à la place");
      }
      setTimeout(logoutToGate, 900);
    });
  }

  // Saves the report two ways depending on where the page runs: inside the
  // Claude artifact viewer, raw browser downloads are inert, so we use the
  // platform's `downloads` capability (native save/share prompt); on a plain
  // host (e.g. GitHub Pages) that capability doesn't exist, so we fall back
  // to a standard Blob download, which works there.
  function saveReportFile(filename, csvContent){
    var payload = "\ufeff" + csvContent;
    if(typeof window.claude !== "undefined" && window.claude && window.claude.use){
      return window.claude.use("downloads").then(function(downloads){
        if(!downloads) throw new Error("downloads unavailable");
        return downloads.save({ filename: filename, data: payload });
      }).then(function(){
        return { ok: true };
      }).catch(function(){
        return { ok: false };
      });
    }
    return Promise.resolve({ ok: downloadFileFallback(filename, payload) });
  }

  function downloadFileFallback(filename, content){
    try{
      var blob = new Blob([content], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){
      return false;
    }
  }

  function buildReportCSV(sales, totalRevenue, plein, staff, pleinRev, staffRev, startedAt, refList, closedAt){
    var rows = [];
    var dateLabel = startedAt.toLocaleDateString("fr-FR");
    var timeLabel = String(startedAt.getHours()).padStart(2,"0") + ":" + String(startedAt.getMinutes()).padStart(2,"0");
    rows.push(["Stand Merch — rapport de soirée"]);
    if(closedAt){
      rows.push(["Date", dateLabel, "Début", timeLabel, "Clôture",
        String(closedAt.getHours()).padStart(2,"0") + ":" + String(closedAt.getMinutes()).padStart(2,"0")]);
    } else {
      rows.push(["Date", dateLabel, "Début", timeLabel]);
    }
    rows.push([]);
    rows.push(["RÉSUMÉ"]);
    rows.push(["Chiffre d'affaires", "Ventes", "CA plein tarif", "Qté plein tarif", "CA tarif staff", "Qté tarif staff"]);
    rows.push([csvNum(totalRevenue), sales.length, csvNum(pleinRev), plein.length, csvNum(staffRev), staff.length]);
    rows.push([]);
    if(refList && refList.length){
      rows.push(["DÉTAIL PAR RÉFÉRENCE ET TAILLE"]);
      rows.push(["Référence", "Taille", "Vendus", "CA", "Stock restant"]);
      refList.forEach(function(ref){
        Object.keys(ref.tailles).forEach(function(sz){
          var soldHere = sales.filter(function(s){ return s.refId===ref.id && s.taille===sz; });
          var rev = soldHere.reduce(function(a,x){return a+x.prix;},0);
          rows.push([ref.nom, sz, soldHere.length, csvNum(rev), ref.tailles[sz].stock]);
        });
      });
    } else {
      rows.push(["DÉTAIL PAR RÉFÉRENCE ET TAILLE — non disponible pour cette soirée (archivée avant la mise à jour)."]);
    }
    rows.push([]);
    rows.push(["JOURNAL DES VENTES"]);
    rows.push(["Heure", "Référence", "Taille", "Tarif", "Prix"]);
    sales.forEach(function(s){
      var t = new Date(s.ts);
      rows.push([
        String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0"),
        s.refNom, s.taille, s.tarif === "staff" ? "Staff" : "Plein", csvNum(s.prix)
      ]);
    });
    return rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\n");
  }

  function statTile(label, value, sub, cls){
    return '<div class="stat-tile ' + cls + '"><div class="label">' + label + '</div><div class="value num">' + value + '</div><div class="sub">' + sub + '</div></div>';
  }

  // ---------- init ----------
  function startApp(){
    document.getElementById("site-gate").hidden = true;
    document.getElementById("app-root").hidden = false;
    renderVente();
    renderStock();
    renderRapport();
  }

  if(isGateOpen()){
    startApp();
  } else {
    document.getElementById("site-gate-form").addEventListener("submit", function(e){
      e.preventDefault();
      var u = document.getElementById("gate-user").value.trim();
      var p = document.getElementById("gate-pass").value;
      if(u === GATE_USER && p === GATE_PASS){
        setGateOpen(true);
        startApp();
      } else {
        document.getElementById("gate-error").textContent = "Identifiant ou mot de passe incorrect.";
        document.getElementById("gate-pass").value = "";
        document.getElementById("gate-pass").focus();
      }
    });
  }
})();
</script>
